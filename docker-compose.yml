# Local PostgreSQL only (docs/DEPLOYMENT.md). The app runs natively for fast reloads.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
